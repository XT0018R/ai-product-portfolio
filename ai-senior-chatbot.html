<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>可感可视化大学专业体验馆 · AI 虚拟学长</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #6366F1;
      --primary-dark: #5558E3;
      --primary-light: #EEF0FF;
      --primary-glow: rgba(99,102,241,0.15);
      --accent: #8B5CF6;
      --bg: #F7F8FA;
      --surface: #FFFFFF;
      --surface-2: #F9FAFB;
      --surface-3: #F3F4F6;
      --text: #1F2937;
      --text-light: #6B7280;
      --text-muted: #9CA3AF;
      --border: #E8EAED;
      --border-strong: #D1D5DB;
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
      --shadow-lg: 0 12px 36px rgba(0,0,0,0.08);
      --radius: 16px;
      --radius-sm: 12px;
      --font-display: 'Space Grotesk', -apple-system, sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(99,102,241,0.12); color: var(--primary-dark); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #B0B3B8; }

    /* ========== Screens ========== */
    .screen { display: none; height: 100vh; flex-direction: column; }
    .screen.active { display: flex; }

    /* ========== Home Screen ========== */
    #screen-home { overflow-y: auto; }

    .home-hero {
      background: linear-gradient(180deg, #FFFFFF 0%, #F0F1FF 100%);
      padding: 56px 24px 48px;
      text-align: center;
      color: var(--text);
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }
    .home-hero::before {
      content: '';
      position: absolute;
      top: -120px; right: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(99,102,241,0.1) 0%, transparent 60%);
      border-radius: 50%;
      pointer-events: none;
    }
    .home-hero::after {
      content: '';
      position: absolute;
      bottom: -80px; left: -60px;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(139,92,246,0.08) 0%, transparent 60%);
      border-radius: 50%;
      pointer-events: none;
    }
    .home-hero .hero-icon { font-size: 52px; margin-bottom: 12px; position: relative; z-index: 1; }
    .home-hero h1 {
      font-size: 28px;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
      background: linear-gradient(135deg, #1F2937 0%, #6366F1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .home-hero .hero-tagline { font-size: 15px; color: var(--primary); font-weight: 600; position: relative; z-index: 1; }
    .home-hero .hero-desc { font-size: 13px; color: var(--text-light); margin-top: 10px; line-height: 1.7; position: relative; z-index: 1; }

    .home-content { max-width: 900px; margin: 0 auto; padding: 32px 24px 48px; width: 100%; }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    .section-title .dot { width: 4px; height: 20px; background: linear-gradient(180deg, var(--primary), var(--accent)); border-radius: 2px; }

    .majors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 36px;
    }

    .major-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px 16px;
      cursor: pointer;
      transition: all 0.25s var(--ease);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .major-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
    }
    .major-card .card-icon { font-size: 36px; margin-bottom: 10px; transition: transform 0.25s var(--ease); }
    .major-card:hover .card-icon { transform: scale(1.1); }
    .major-card .card-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
    .major-card .card-tag { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
    .major-card .card-go {
      position: absolute;
      bottom: 8px; right: 12px;
      font-size: 14px;
      color: var(--primary);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .major-card:hover .card-go { opacity: 1; }

    .category-block { margin-bottom: 28px; }
    .category-header {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
      padding: 6px 14px;
      background: var(--surface-3);
      border-radius: 20px;
      display: inline-block;
    }

    .home-footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--text-light);
      line-height: 1.8;
    }
    .home-footer strong { color: var(--primary); }

    /* ========== Detail Screen ========== */
    #screen-detail { overflow-y: auto; }

    .detail-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .nav-back {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      transition: all 0.2s;
    }
    .nav-back:hover { background: var(--surface-3); border-color: var(--border-strong); }

    .detail-hero {
      background: linear-gradient(180deg, #FFFFFF 0%, #F0F1FF 100%);
      padding: 40px 24px;
      text-align: center;
      color: var(--text);
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }
    .detail-hero::before {
      content: '';
      position: absolute;
      top: -60px; left: 50%; transform: translateX(-50%);
      width: 400px; height: 300px;
      background: radial-gradient(circle, rgba(99,102,241,0.1) 0%, transparent 60%);
      border-radius: 50%;
      pointer-events: none;
    }
    .detail-hero .hero-icon { font-size: 56px; margin-bottom: 12px; position: relative; z-index: 1; }
    .detail-hero h2 {
      font-size: 26px;
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
      background: linear-gradient(135deg, #1F2937 0%, #6366F1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .detail-hero .hero-tag { font-size: 15px; color: var(--primary); font-weight: 500; position: relative; z-index: 1; }

    .detail-content {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 24px 100px;
      width: 100%;
    }

    .info-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .info-section h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    .info-section p {
      font-size: 14px;
      line-height: 1.8;
      color: var(--text-light);
    }
    .info-section .info-list {
      font-size: 14px;
      line-height: 2;
      color: var(--text-light);
    }

    .detail-cta {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 16px rgba(0,0,0,0.04);
      z-index: 20;
    }
    .detail-cta-inner {
      max-width: 720px;
      margin: 0 auto;
    }
    .btn-cta {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      box-shadow: 0 4px 14px rgba(99,102,241,0.25);
    }
    .btn-cta:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.35); }
    .btn-cta:active { transform: translateY(0); }

    /* ========== Chat Screen ========== */
    #screen-chat { display: none; }
    #screen-chat.active { display: flex; flex-direction: column; }

    .chat-header {
      background: var(--surface);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      flex-shrink: 0;
    }
    .chat-header-left { display: flex; align-items: center; gap: 10px; }
    .chat-header-logo {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 18px;
    }
    .chat-header-info h3 { font-size: 15px; line-height: 1.3; color: var(--text); }
    .chat-header-info p { font-size: 11px; color: var(--text-muted); }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      scroll-behavior: smooth;
    }
    .messages-inner { max-width: 760px; margin: 0 auto; padding: 0 20px; }

    .message { display: flex; gap: 10px; margin-bottom: 18px; animation: fadeInUp 0.3s ease; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
    }
    .avatar.bot { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; }
    .avatar.user { background: var(--surface-3); color: var(--text-light); }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.7;
      word-break: break-word;
    }
    .bubble.bot { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-bottom-left-radius: 4px; color: var(--text); }
    .bubble.user { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; border-bottom-right-radius: 4px; font-weight: 500; }
    .bubble.bot p { margin-bottom: 8px; }
    .bubble.bot p:last-child { margin-bottom: 0; }
    .bubble.bot ul, .bubble.bot ol { padding-left: 20px; margin-bottom: 8px; }
    .bubble.bot li { margin-bottom: 4px; }
    .bubble.bot strong { color: var(--primary); font-weight: 600; }
    .bubble.bot code { background: var(--surface-3); padding: 2px 6px; border-radius: 4px; font-size: 13px; color: var(--primary); }

    .typing-indicator { display: flex; gap: 4px; padding: 4px 0; }
    .typing-indicator span { width: 8px; height: 8px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-6px); opacity: 1; } }

    .quick-questions {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 20px 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .quick-question {
      padding: 7px 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      color: var(--text);
      white-space: nowrap;
    }
    .quick-question:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

    .input-area { background: var(--surface); padding: 14px 20px 18px; border-top: 1px solid var(--border); flex-shrink: 0; }
    .input-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
    .input-inner textarea {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-size: 14.5px;
      font-family: inherit;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color 0.2s;
      background: var(--surface);
      color: var(--text);
    }
    .input-inner textarea::placeholder { color: var(--text-muted); }
    .input-inner textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
    .btn-send {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none; border-radius: 12px;
      color: white; font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s var(--ease);
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(99,102,241,0.2);
    }
    .btn-send:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(99,102,241,0.3); }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
    .input-hint { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 6px; }

    .error-bubble { background: #FEF2F2; border: 1px solid #FECACA; color: #DC2626; }

    /* ========== Hot Badge ========== */
    .hot-badge {
      display: inline-block;
      font-size: 10px;
      background: linear-gradient(135deg, #FF6B6B, #EE5A52);
      color: white;
      padding: 1px 6px;
      border-radius: 8px;
      vertical-align: middle;
      margin-left: 2px;
      font-weight: 600;
    }
    .major-card-hot { border-color: rgba(255,107,107,0.15); }
    .major-card-hot:hover { border-color: rgba(255,107,107,0.4); }

    /* ========== 想象 vs 现实 ========== */
    .vs-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .vs-section h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    .vs-container {
      display: grid;
      grid-template-columns: 1fr 40px 1fr;
      gap: 0;
      align-items: stretch;
    }
    .vs-col {
      padding: 18px 16px;
      border-radius: 12px;
      text-align: center;
    }
    .vs-col.vs-img {
      background: linear-gradient(135deg, #FFF7ED, #FFEDD5);
      border: 1px solid #FED7AA;
    }
    .vs-col.vs-real {
      background: linear-gradient(135deg, #F0FDF4, #DCFCE7);
      border: 1px solid #BBF7D0;
    }
    .vs-col .vs-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .vs-col.vs-img .vs-label { color: #EA580C; }
    .vs-col.vs-real .vs-label { color: #16A34A; }
    .vs-col .vs-text {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
    }
    .vs-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--text-muted);
    }
    .vs-quote {
      margin-top: 14px;
      padding: 12px 16px;
      background: var(--primary-light);
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-light);
      line-height: 1.6;
      text-align: center;
    }
    .vs-quote strong { color: var(--primary); }

    /* ========== 雷达图 ========== */
    .radar-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .radar-section h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      color: var(--text);
    }
    .radar-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 0;
    }
    .radar-wrapper svg text { font-family: inherit; }

    /* ========== Responsive ========== */
    @media (max-width: 640px) {
      .home-hero { padding: 40px 20px 32px; }
      .home-hero h1 { font-size: 22px; }
      .majors-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
      .major-card { padding: 16px 12px; }
      .detail-hero { padding: 32px 20px; }
      .detail-hero h2 { font-size: 22px; }
      .info-section { padding: 18px; }
      .messages-inner, .quick-questions, .input-inner { padding: 0 14px; }
      .input-area { padding: 12px 14px 16px; }
      .bubble { max-width: 85%; font-size: 14px; }
      .vs-container { grid-template-columns: 1fr; gap: 8px; }
      .vs-divider { transform: rotate(90deg); padding: 4px 0; }
      .info-section, .vs-section, .radar-section { padding: 18px; }
    }
  </style>
</head>
<body>

  <!-- ===== Screen 1: Home ===== -->
  <div class="screen active" id="screen-home">
    <div class="home-hero">
      <div class="hero-icon">🎓</div>
      <h1>可感可视化大学专业体验馆</h1>
      <p class="hero-tagline">上大学前，先体验专业</p>
      <p class="hero-desc">想象与现实之间，隔着四年的青春。<br>AI 虚拟学长带你提前走进真实大学生活，看清课程、就业与考研真相——<br>让每一次选择都心里有底，不再一头雾水地选专业。</p>
    </div>
    <div class="home-content">
      <div id="popular-section"></div>
      <div id="category-section"></div>
    </div>
    <div class="home-footer">
      <p>省级大学生创新创业训练计划项目 · AI 升级版</p>
      <p>由 <strong>云南大学建筑学</strong> 田欣然发起 · 2021.10 - 至今</p>
      <p style="margin-top:8px;">Powered by DeepSeek · 每次体验限 30 轮对话</p>
    </div>
  </div>

  <!-- ===== Screen 2: Detail ===== -->
  <div class="screen" id="screen-detail">
    <div class="detail-nav">
      <button class="nav-back" onclick="showScreen('home')">← 返回专业选择</button>
    </div>
    <div id="detail-body"></div>
    <div class="detail-cta">
      <div class="detail-cta-inner">
        <button class="btn-cta" id="btn-start-chat">与 AI 学长对话 →</button>
      </div>
    </div>
  </div>

  <!-- ===== Screen 3: Chat ===== -->
  <div class="screen" id="screen-chat">
    <div class="chat-header">
      <div class="chat-header-left">
        <button class="nav-back" onclick="showScreen('detail')">←</button>
        <div class="chat-header-logo" id="chat-logo">🎓</div>
        <div class="chat-header-info">
          <h3 id="chat-title">AI 虚拟学长</h3>
          <p id="chat-status">在线</p>
        </div>
      </div>
      <button class="nav-back" onclick="resetChat()" style="padding:8px 10px;">🗑</button>
    </div>
    <div class="messages-container" id="messages-container">
      <div class="messages-inner" id="messages"></div>
    </div>
    <div class="quick-questions" id="quick-questions"></div>
    <div class="input-area">
      <div class="input-inner">
        <textarea id="user-input" placeholder="问问学长关于这个专业的问题..." rows="1"></textarea>
        <button class="btn-send" id="send-btn">➤</button>
      </div>
      <p class="input-hint">按 Enter 发送 · Shift + Enter 换行 · Powered by DeepSeek</p>
    </div>
  </div>

  <script>
    // ========== Majors Data ==========
    const MAJORS = {

              <div class="card-go">→</div>
            </div>
          `).join('')}
        </div>
      `;
      document.getElementById('popular-section').innerHTML = popularHtml;

      // All majors by category (including hot ones)
      let catHtml = '<div class="section-title"><span class="dot"></span>按大类浏览</div>';
      for (const cat of CATEGORY_ORDER) {
        const majors = Object.entries(MAJORS).filter(([_, m]) => m.category === cat);
        if (majors.length === 0) continue;
        catHtml += `
          <div class="category-block">
            <div class="category-header">${CATEGORY_LABELS[cat] || cat}</div>
            <div class="majors-grid">
              ${majors.map(([id, m]) => `
                <div class="major-card${m.hot ? ' major-card-hot' : ''}" onclick="showDetail('${id}')">
                  <div class="card-icon">${m.icon}</div>
                  <div class="card-name">${m.name}${m.hot ? ' <span class="hot-badge">热</span>' : ''}</div>
                  <div class="card-tag">${m.tagline}</div>
                  <div class="card-go">→</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
      document.getElementById('category-section').innerHTML = catHtml;
    }

    // ========== Radar Chart Generator ==========
    function generateRadarChart(radar) {
      const dims = Object.keys(radar);
      const values = Object.values(radar);
      const n = dims.length;
      const cx = 130, cy = 130, maxR = 95;
      const levels = 5;

      const angles = dims.map((_, i) => -Math.PI / 2 + (i * 2 * Math.PI) / n);

      // Grid polygons
      let gridSvg = '';
      for (let l = 1; l <= levels; l++) {
        const r = (maxR * l) / levels;
        const points = angles.map(a => `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`).join(' ');
        gridSvg += `<polygon points="${points}" fill="none" stroke="#E5E7EB" stroke-width="1" opacity="${0.4 + l * 0.1}"/>`;
      }

      // Axis lines
      let axisSvg = '';
      angles.forEach(a => {
        axisSvg += `<line x1="${cx}" y1="${cy}" x2="${(cx + maxR * Math.cos(a)).toFixed(1)}" y2="${(cy + maxR * Math.sin(a)).toFixed(1)}" stroke="#D1D5DB" stroke-width="1"/>`;
      });

      // Data polygon
      const dataPoints = angles.map((a, i) => {
        const r = (maxR * values[i]) / 10;
        return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`;
      }).join(' ');

      // Data points
      let dotsSvg = '';
      values.forEach((v, i) => {
        const a = angles[i];
        const r = (maxR * v) / 10;
        dotsSvg += `<circle cx="${(cx + r * Math.cos(a)).toFixed(1)}" cy="${(cy + r * Math.sin(a)).toFixed(1)}" r="3.5" fill="#6366F1"/>`;
      });

      // Labels
      let labelSvg = '';
      dims.forEach((dim, i) => {
        const a = angles[i];
        const lx = cx + (maxR + 22) * Math.cos(a);
        const ly = cy + (maxR + 22) * Math.sin(a);
        labelSvg += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#6B7280" font-weight="600">${dim}</text>`;
        // Value labels
        const vr = (maxR * values[i]) / 10;
        const vx = cx + (vr + 14) * Math.cos(a);
        const vy = cy + (vr + 14) * Math.sin(a);
        labelSvg += `<text x="${vx.toFixed(1)}" y="${vy.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#6366F1" font-weight="700">${values[i]}</text>`;
      });

      return `<svg viewBox="0 0 260 260" width="260" height="260" style="max-width:100%;height:auto;">
        ${gridSvg}
        ${axisSvg}
        <polygon points="${dataPoints}" fill="rgba(99,102,241,0.12)" stroke="#6366F1" stroke-width="2" stroke-linejoin="round"/>
        ${dotsSvg}
        ${labelSvg}
      </svg>`;
    }

    // ========== Detail Screen Render ==========

          </div>

          <div class="info-section">

          </div>

            <h3>💼 就业方向</h3>

    // ========== Chat Logic ==========
    function startChat(majorId) {
      currentMajorId = majorId;
      currentMajor = MAJORS[majorId];
      messageCount = 0;

      // Update header
      document.getElementById('chat-logo').textContent = currentMajor.icon;
      document.getElementById('chat-title').textContent = currentMajor.icon + ' ' + currentMajor.name + ' · AI 学长';
      document.getElementById('chat-status').textContent = '在线 · 还可提问 ' + (MAX_MESSAGES - messageCount) + ' 次';

      // Render quick questions
      const qq = document.getElementById('quick-questions');
      qq.innerHTML = currentMajor.quickQuestions.map(q =>
        `<div class="quick-question" data-q="${q}">${q}</div>`
      ).join('');

      // Init messages
      messages = [];
      messagesEl.innerHTML = '';
      const welcome = getWelcomeMessage(currentMajor);
      addMessage('bot', welcome);
      messages.push({ role: 'assistant', content: welcome });

      showScreen('chat');
    }

    function getWelcomeMessage(m) {
      return `你好呀！我是**${m.name}**专业的 AI 虚拟学长 ${m.icon}\n\n无论你是正在选专业的高中生，还是帮孩子了解专业的家长，都可以问我关于**${m.name}**的任何问题——课程内容、日常学习、就业方向、考研情况，知无不言！\n\n你可以直接打字问我，也可以点下面的问题快速开始 👇`;
    }

    function buildSystemPrompt(m) {
      return `# 角色
你是一所综合性大学「${m.name}」专业的大四学长/学姐，正在和高中生或高中生家长聊天。你的任务是帮助他们了解${m.name}专业真实的学习体验、课程内容、就业方向和考研情况。

# 专业概况
${m.name}：${m.intro}

# 核心课程
${m.courses}

# 日常学习体验
${m.dailyLife}

# 就业方向
${m.employment}

# 考研情况
${m.gradSchool}

# 给高中生的建议
${m.tips}

# 性格特点
- 友好亲切，像真实学长一样聊天，用口语化表达
- 真诚不吹嘘，该说难的就说难，该说好的就说好
- 有耐心，愿意举具体例子帮助高中生理解
- 偶尔用一些大学生常用语，但不要过度

# 回答规则
1. 每次回答控制在 3-5 句话，不要太长，像聊天一样自然
2. 如果被问到你不确定的具体数据（如就业率、薪资数字），诚实说"这个我不太确定具体数据，但据我了解大概在 XX 范围"
3. 如果被问到其他专业的情况，引导用户返回首页选择对应专业体验
4. 鼓励用户多问，结束时可以说"还有什么想了解的吗？"
5. 如果高中生表达焦虑（如"我 xx 不好能学吗"），先安抚再给建议
6. 不要用 markdown 标题语法，用自然的口语化表达
7. 可以用 **加粗** 强调关键词，但不要过度`;
    }

    function addMessage(role, content, streaming = false) {
      const div = document.createElement('div');
      div.className = `message ${role === 'user' ? 'user' : 'bot'}`;

      const avatar = document.createElement('div');
      avatar.className = `avatar ${role === 'user' ? 'user' : 'bot'}`;
      avatar.textContent = role === 'user' ? '🙋' : (currentMajor ? currentMajor.icon : '🎓');

      const bubble = document.createElement('div');
      bubble.className = `bubble ${role === 'user' ? 'user' : 'bot'}`;

      if (role === 'bot' && !streaming) {
        bubble.innerHTML = marked.parse(content);
      } else if (streaming) {
        bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
      } else {
        bubble.textContent = content;
      }

      div.appendChild(avatar);
      div.appendChild(bubble);
      messagesEl.appendChild(div);
      scrollToBottom();
      return bubble;
    }

    function scrollToBottom() {
      messagesScroll.scrollTop = messagesScroll.scrollHeight;
    }

    function updateBubble(bubble, content) {
      bubble.innerHTML = marked.parse(content);
      scrollToBottom();
    }

    // ========== Send Message ==========
    async function sendMessage(text) {
      if (isStreaming) return;
      if (!text.trim()) return;

      if (messageCount >= MAX_MESSAGES) {
        addMessage('bot', '本体验已达对话上限（30 轮），感谢使用 AI 虚拟学长！如需继续体验请返回选择其他专业。');
        return;
      }

      messageCount++;
      document.getElementById('chat-status').textContent = '在线 · 还可提问 ' + (MAX_MESSAGES - messageCount) + ' 次';

      addMessage('user', text);
      messages.push({ role: 'user', content: text });

      userInput.value = '';
      autoResize(userInput);

      isStreaming = true;
      sendBtn.disabled = true;

      if (!apiKey) {
        addMessage('bot', '⚠️ 本开源版未内置 API Key。请在源码第 871 行填入你自己的 DeepSeek API key（https://platform.deepseek.com）后刷新页面，即可开始对话。');
        sendBtn.disabled = false;
        isStreaming = false;
        return;
      }

      const botBubble = addMessage('bot', '', true);

      try {
        const response = await fetch('https://api.deepseek.com/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [
              { role: 'system', content: buildSystemPrompt(currentMajor) },
              ...messages.map(m => ({ role: m.role, content: m.content }))
            ],
            stream: true,
            temperature: 0.7,
            max_tokens: 800
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error?.message || `API Error ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullContent = '';
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6).trim();
            if (data === '[DONE]') continue;

            try {
              const json = JSON.parse(data);
              const delta = json.choices[0]?.delta?.content;
              if (delta) {
                fullContent += delta;
                updateBubble(botBubble, fullContent);
              }
            } catch (e) { /* skip */ }
          }
        }

        if (!fullContent) {
          updateBubble(botBubble, '抱歉，我没有收到回复内容，请重新试一下。');
        }

        messages.push({ role: 'assistant', content: fullContent });

      } catch (error) {
        botBubble.className = 'bubble bot error-bubble';
        let msg = error.message;
        if (msg.includes('401') || msg.includes('Authentication')) msg = '服务暂时不可用，请稍后重试。';
        else if (msg.includes('429')) msg = '请求太频繁了，请稍等几秒再试。';
        else if (msg.includes('Failed to fetch')) msg = '网络连接失败，请检查网络后重试。';
        botBubble.textContent = '❌ ' + msg;
      } finally {
        isStreaming = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    // ========== Event Listeners ==========
    sendBtn.addEventListener('click', () => sendMessage(userInput.value));

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(userInput.value);
      }
    });

    userInput.addEventListener('input', () => autoResize(userInput));

    function autoResize(ta) {
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
    }

    document.getElementById('quick-questions').addEventListener('click', (e) => {
      const q = e.target.closest('.quick-question');
      if (q) sendMessage(q.dataset.q);
    });

    function resetChat() {
      if (confirm('确定要清空当前对话吗？')) {
        startChat(currentMajorId);
      }
    }

    // ========== Init ==========
    renderHome();
  </script>
